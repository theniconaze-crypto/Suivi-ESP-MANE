/* Hachage de mot de passe : PBKDF2-SHA256, 100 000 itérations, sel aléatoire par utilisateur */
const hex = buf => [...new Uint8Array(buf)].map(b => pad(b.toString(16))).join('');
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(16)));
async function hashPw(pw, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, key, 256));
}

/* Référentiels (listes de valeurs des colonnes ESP), gérés par l'administrateur et stockés dans Firestore : config/lists.

};

}

/* =====================================================================
   5. CALCUL DES ÉCHÉANCES RÉGLEMENTAIRES
   - Une requalification périodique (RP) inclut l'inspection : elle remet aussi à zéro la visite périodique.
   - Un contrôle "Non conforme" ne remet pas les compteurs à zéro.
   - Sans contrôle enregistré, la base est la date de mise en service (ou le 1er janvier de l'année de construction).
   ===================================================================== */
function dueOf(e) {
  const done = state.controls.filter(c => c.espId === e.id && ['Réalisé', 'Clôturé'].includes(c.status) && c.doneDate && c.result !== 'Non conforme');
  const last = t => done.filter(c => c.type === t).map(c => c.doneDate).sort().pop() || null;
  const lastRP = last('Requalification périodique');
  let lastIP = last('Visite périodique');
  if (lastRP && (!lastIP || lastRP > lastIP)) lastIP = lastRP;
  const base = e.commissioningDate || (e.year ? `${e.year}-01-01` : null);
  const ipDue = (lastIP || base) && e.ipMonths > 0 ? addMonths(lastIP || base, +e.ipMonths) : null;
  const rpDue = (lastRP || base) && e.rpMonths > 0 ? addMonths(lastRP || base, +e.rpMonths) : null;
  const next = [ipDue, rpDue].filter(Boolean).sort()[0] || null;
  const nextType = next ? (next === ipDue ? 'Visite périodique' : 'Requalification périodique') : null;
  const r = { lastIP, lastRP, ipDue, rpDue, next, nextType, days: next ? daysUntil(next) : null, monitored: e.status !== OUT_STATUS };
  return Object.assign(r, planOf(e, r));
}
/* Planification : une échéance échue ou à ≤ PLAN_HORIZON_DAYS est « sans planification » si aucun contrôle au statut « Planifié »,
   daté d'aujourd'hui ou du futur, ne la couvre. Une requalification couvre aussi la visite périodique, pas l'inverse.
   gap = { type, due, days, stale } (stale : un contrôle « Planifié » existe mais sa date est dépassée ou absente) ; planned = 1re date planifiée à venir. */
function planOf(e, d) {
  if (!d.monitored) return { gap: null, planned: null };
  const today = todayISO();
  const open = state.controls.filter(c => c.espId === e.id && c.status === 'Planifié');
  const future = open.filter(c => c.plannedDate && c.plannedDate >= today);
  const match = (c, t) => c.type === t || (t === 'Visite périodique' && c.type === 'Requalification périodique');
  const gap = [['Requalification périodique', d.rpDue], ['Visite périodique', d.ipDue]]
    .filter(([t, due]) => due && daysUntil(due) <= PLAN_HORIZON_DAYS && !future.some(c => match(c, t)))
    .map(([type, due]) => {
      const st = open.filter(c => match(c, type)).sort((a, b) => (b.plannedDate || '').localeCompare(a.plannedDate || ''))[0];
      return { espId: e.id, type, due, days: daysUntil(due), stale: !!st, staleId: st?.id || '' };
    })
    .sort((a, b) => a.due.localeCompare(b.due))[0] || null;
  return { gap, planned: future.map(c => c.plannedDate).sort()[0] || null };
}
const BADGE = {
  red: 'bg-red-100 text-red-800 ring-red-300', orange: 'bg-orange-100 text-orange-800 ring-orange-300',
  yellow: 'bg-yellow-100 text-yellow-800 ring-yellow-300', green: 'bg-emerald-100 text-emerald-800 ring-emerald-300',
  gray: 'bg-slate-100 text-slate-600 ring-slate-300', blue: 'bg-sky-100 text-sky-800 ring-sky-300',
  violet: 'bg-violet-100 text-violet-800 ring-violet-300'
};
const badge = (t, c) => `<span class="inline-block whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${BADGE[c]}">${esc(t)}</span>`;

}

function planBadge(d) {

    // À planifier → nouvelle planification pré-remplie ; planification dépassée → ouverture du contrôle existant (replanifier ou clôturer)
    const attrs = g.stale && g.staleId ? `data-act="ctrl-open" data-id="${esc(g.staleId)}"` : `data-act="plan-new" data-esp="${esc(g.espId)}" data-type="${esc(g.type)}" data-due="${esc(g.due)}"`;
    const title = g.stale ? 'Ouvrir le contrôle planifié pour le replanifier ou le clôturer' : 'Planifier ce contrôle';

  }
  return d.planned ? `<span class="text-xs text-slate-600">Planifié le ${fmtDate(d.planned)}</span>` : '<span class="text-slate-500">—</span>';
}
const DUE_OPTS = ['Échu', '≤ 30 jours', '≤ 90 jours', 'Conforme'];
const PLAN_OPTS = [PLAN_FILTER, 'Planifié'];      // « Planifié » = un contrôle « Planifié » à venir existe et aucune échéance proche n'est découverte

}

const gapCell = d => d.gap ? 'border-l-4 border-l-violet-500' : '';   // repère visuel en début de ligne
const dueClass = d => !d.monitored || d.days === null ? 'gray' : d.days < 0 ? 'red' : d.days <= 30 ? 'orange' : d.days <= 90 ? 'yellow' : 'green';

/* =====================================================================
   6. ÉCRITURE + JOURNAL D'AUDIT (traçabilité)
   ===================================================================== */
const normV = v => {
  if (v == null || v === '') return '';
  if (Array.isArray(v)) return v.map(a => typeof a === 'string' ? a : a.name).join(', ');
  if (typeof v === 'object') return Object.entries(v).filter(([, x]) => x).map(([k]) => (PERMS.find(p => p.key === k) || {}).label || k).join(', ');
  return String(v);
};
function diff(before, after) {
  const out = [];
  Object.keys(after).forEach(k => {
    const o = normV(before?.[k]), n = normV(after[k]);
    if (o !== n) out.push({ field: FL[k] || k, old: o.slice(0, 200), new: n.slice(0, 200) });
  });
  return out;
}
function auditEntry(o) {
  return { ts: FV.serverTimestamp(), user: state.user.username, action: o.action, entity: o.entity,
           entityId: o.entityId, label: o.label, espId: o.espId || '', changes: o.changes || [] };
}
/* Enregistre (création ou modification) + écrit l'entrée d'audit dans un même batch atomique */
async function saveWithAudit({ col, id, data, before, entity, label, espId }) {
  const changes = diff(before, data);
  if (before && !changes.length) return false;
  const batch = db.batch();
  const meta = { updatedAt: FV.serverTimestamp(), updatedBy: state.user.username };
  if (!before) { meta.createdAt = FV.serverTimestamp(); meta.createdBy = state.user.username; }
  batch.set(db.collection(col).doc(id), { ...data, ...meta }, { merge: true });
  batch.set(db.collection('audit').doc(), auditEntry({ action: before ? 'Modification' : 'Création', entity, entityId: id, label, espId, changes }));
  await batch.commit(); return true;
}
async function deleteWithAudit({ col, id, entity, label, espId, changes = [], alsoDelete = [] }) {
  const batch = db.batch();
  batch.delete(db.collection(col).doc(id));
  alsoDelete.forEach(r => batch.delete(db.collection(r.col).doc(r.id)));
  batch.set(db.collection('audit').doc(), auditEntry({ action: 'Suppression', entity, entityId: id, label, espId, changes }));
  await batch.commit();
}

   7. AUTHENTIFICATION (utilisateurs stockés dans Firestore)
   ===================================================================== */
async function login(username, pw) {
  username = username.trim().toLowerCase();
  const snap = await db.collection('users').doc(username).get();
  if (!snap.exists) {
    // Amorçage : création du compte admin par défaut à la première connexion
    if (username === 'admin' && pw === ADMIN_DEFAULT_PASSWORD) {
      const salt = newSalt();
      const u = { username: 'admin', displayName: 'Administrateur', role: 'admin', salt, hash: await hashPw(pw, salt), active: true, permissions: {} };
      await db.collection('users').doc('admin').set({ ...u, createdAt: FV.serverTimestamp() });
      return u;
    }
    throw new Error('Identifiant ou mot de passe incorrect.');
  }
  const u = snap.data();
  if (u.active === false) throw new Error('Ce compte est désactivé. Contactez un administrateur.');
  if (await hashPw(pw, u.salt) !== u.hash) throw new Error('Identifiant ou mot de passe incorrect.');
  return u;
}
function startSession(u) {
  state.user = u; sessionStorage.setItem('esp_user', u.username);
  startListeners(); renderShell();
}
function logout() {
  unsubs.splice(0).forEach(f => f()); sessionStorage.removeItem('esp_user');
  Object.assign(state, { user: null, esp: [], controls: [], audit: [], users: [],
    config: {}, configError: '', fDash: { pole: '', due: '', plan: '', next: '' }, fEsp: { q: '', status: '', atex: '', due: '', pole: '', plan: '' }, fCtrl: { q: '', type: '', status: '', result: '', gap: '' }, sCtrl: { key: '', dir: 'asc' }, fAudit: '' });
  closeModal(); renderLogin();
}
/* Signature canonique des droits : Firestore ne garantit pas l'ordre des clés d'une map (cache local vs serveur),
   donc on compare rôle + permissions actives + pôles TRIÉS, sinon les écouteurs sont relancés en boucle. */
const userSig = u => JSON.stringify([u.role || '', Object.keys(u.permissions || {}).filter(k => u.permissions[k]).sort(), [...(u.poles || [])].sort()]);
function startListeners() {
  unsubs.splice(0).forEach(f => f());
  const err = e => { console.error(e); toast('Erreur Firestore : ' + e.message, 'err'); };
  const list = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  // Le profil courant est surveillé : changement de droits ou désactivation pris en compte en direct
  unsubs.push(db.collection('users').doc(state.user.username).onSnapshot(s => {
    if (!s.exists || s.data().active === false) { toast('Session terminée : compte supprimé ou désactivé.', 'err'); return logout(); }
    const prev = userSig(state.user);
    state.user = s.data();
    if (prev !== userSig(state.user)) setTimeout(() => { startListeners(); renderShell(); }, 0);
  }, err));
  unsubs.push(db.collection('config').doc('lists').onSnapshot(s => { state.config = s.exists ? s.data() : {}; state.configError = ''; renderView(); },
    e => { console.warn('Référentiels indisponibles :', e.message); state.configError = e.message; state.config = {}; if (state.route === 'lists') renderView(); }));
  unsubs.push(db.collection('esp').onSnapshot(s => { state.esp = list(s); renderView(); }, err));
  unsubs.push(db.collection('controls').onSnapshot(s => { state.controls = list(s); renderView(); }, err));
  if (can('view_audit'))
    unsubs.push(db.collection('audit').orderBy('ts', 'desc').limit(300).onSnapshot(s => { state.audit = list(s); if (state.route === 'audit') renderView(); }, err));
  if (can('manage_users'))
    unsubs.push(db.collection('users').onSnapshot(s => { state.users = list(s); if (state.route === 'users') renderView(); }, err));
}

function ctrlTable() {
  const f = state.fCtrl, q = f.q.toLowerCase(), vis = visibleIds(), sc = state.sCtrl;
  const rows = state.controls.filter(c => {
    if (!vis.has(c.espId)) return false;
    const e = espById(c.espId);
    if (q && !`${e?.tag} ${e?.name} ${c.inspector} ${c.comment} ${c.gapNumber} ${c.gapLabel}`.toLowerCase().includes(q)) return false;
    return (!f.type || c.type === f.type) && (!f.status || c.status === f.status) && (!f.result || c.result === f.result) && (!f.gap || gapOf(c) === f.gap);
  }).sort((a, b) => (b.doneDate || b.plannedDate || '').localeCompare(a.doneDate || a.plannedDate || ''));   // ordre par défaut : date décroissante
  const col = CTRL_COLS.find(x => x.key === sc.key);
  if (col) {                                       // tri stable : à valeur égale, l'ordre par date est conservé
    const m = sc.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      const x = col.v(a), y = col.v(b);
      if (x === '' && y === '') return 0; if (x === '') return 1; if (y === '') return -1;
      return m * (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'fr', { numeric: true, sensitivity: 'base' }));
    });
  }
  const th = c => {
    const on = sc.key === c.key, arrow = on ? (sc.dir === 'asc' ? '▲' : '▼') : '↕';
    return `<th aria-sort="${on ? (sc.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" class="inline-flex items-center gap-1 font-semibold hover:text-slate-900 ${on ? 'text-sky-800' : ''}" data-act="ctrl-sort" data-key="${c.key}" title="Trier par « ${esc(c.label)} »">${c.label}<span class="${on ? '' : 'opacity-40'}" aria-hidden="true">${arrow}</span></button></th>`;
  };
  return `<table class="w-full min-w-[1100px]"><thead><tr>${CTRL_COLS.map(th).join('')}</tr></thead><tbody>
  ${rows.map(c => { const e = espById(c.espId), g = gapOf(c) === 'Oui';
    return `<tr data-act="ctrl-open" data-id="${c.id}"><td class="font-medium">${esc(e?.tag || '(supprimé)')}</td><td>${esc(e?.name || '—')}</td><td>${esc(c.type)}</td><td>${ctrlStatusBadge(c.status)}</td>
    <td>${fmtDate(c.plannedDate)}</td><td>${fmtDate(c.doneDate)}</td><td>${esc(c.inspector)}</td><td>${resultBadge(c.result)}</td>
    <td>${badge(g ? 'Oui' : 'Non', g ? 'red' : 'gray')}${g && (c.gapNumber || c.gapLabel) ? `<div class="text-xs text-slate-600 mt-1">${c.gapNumber ? carlLink(c) : ''}${c.gapNumber && c.gapLabel ? ' · ' : ''}${esc(c.gapLabel)}</div>` : ''}</td>
    <td>${(c.attachments || []).length}</td></tr>`; }).join('')
    || `<tr><td colspan="10" class="text-slate-500">Aucun contrôle enregistré.</td></tr>`}</tbody></table>`;
}

    <ul class="mt-3 flex flex-wrap gap-2">
      ${vals.map(v => { const n = usageCount(key, v), locked = (d.locked || []).includes(v);

async function loadDemo() {
  if (state.user.role !== 'admin') return toast("Réservé à l'administrateur.", 'err');
  if (!confirm("Ajouter les données de démonstration (28 ESP, leurs contrôles et 3 comptes de test) aux données existantes ?")) return;
  toast('Chargement en cours…', 'info');
  const specs = demoSpecs(), ops = [], me = state.user.username;
  const meta = { createdAt: FV.serverTimestamp(), createdBy: me, updatedAt: FV.serverTimestamp(), updatedBy: me };
  const plus = n => { const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); };
  let nCtrl = 0;
  specs.forEach((s, i) => {
    const id = 'demo_' + s.tag, [ipM, rpM] = DEFAULT_PERIODS[s.type];
    const comm = s.commAgoM ? addMonths(todayISO(), -s.commAgoM) : `${s.year}-05-15`;
    ops.push({ ref: db.collection('esp').doc(id), data: { tag: s.tag, name: s.name, pole: s.pole, serial: `SN-${String(s.year).slice(2)}-${4100 + i * 53}`, manufacturer: s.manufacturer, year: s.year,
      category: s.category, type: s.type, fluid: s.fluid, fluidGroup: s.fluidGroup, ps: s.ps, volume: s.volume, dn: s.dn, atex: s.atex, status: s.status,
      building: s.building, workshop: s.workshop, location: s.location, commissioningDate: comm, ipMonths: ipM, rpMonths: rpM, notes: s.notes || '', ...meta } });
    ops.push({ ref: db.collection('audit').doc(), data: auditEntry({ action: 'Création', entity: 'ESP', entityId: id, label: s.tag, espId: id, changes: [{ field: 'Origine', old: '', new: 'Données de démonstration' }] }) });
    const doc = (label, date) => ({ name: `${label} ${s.tag} ${date.slice(0, 4)}.pdf`, url: `https://ged.exemple.fr/esp/${s.tag}/${label.toLowerCase().replace(/\W+/g, '-')}-${date.slice(0, 4)}.pdf`, kind: 'link' });
    let n = 0;
    const ctrl = (type, status, planned, done, result, comment, docs) => {
      n++; nCtrl++;
      ops.push({ ref: db.collection('controls').doc(`${id}_${n}`), data: { espId: id, type, status, plannedDate: planned || '', doneDate: done || '', inspector: DEMO_ORGS[(i + n) % 3],
        result: result || '', comment: comment || '', attachments: docs || [], validatedBy: status === 'Clôturé' ? me : '', validatedAt: status === 'Clôturé' ? done : '', ...meta } });
    };
    if (s.ipIn != null) {
      const last = addMonths(plus(s.ipIn), -ipM);
      if (last > comm) {
        const prev = addMonths(last, -ipM);
        if (prev > comm) ctrl('Visite périodique', 'Clôturé', prev, prev, 'Conforme', 'Aucune anomalie constatée.', [doc('Rapport de visite', prev)]);
        const res = i % 7 === 3 ? 'Conforme avec réserves' : 'Conforme';
        ctrl('Visite périodique', s.ipStatus || 'Clôturé', last, last, res, res === 'Conforme' ? 'Aucune anomalie constatée.' : 'Réserve mineure : calorifuge à reprendre, levée sous 3 mois.', [doc('Rapport de visite', last)]);
      }
    }
    if (s.rpIn != null) {
      const last = addMonths(plus(s.rpIn), -rpM);
      if (last > comm) ctrl('Requalification périodique', 'Clôturé', last, last, 'Conforme', 'Inspection, épreuve et contrôle des accessoires de sécurité satisfaisants.', [doc('PV requalification', last), doc('Attestation épreuve', last)]);
    }
    if (s.nc) { const d = plus(-s.nc.d); ctrl('Visite périodique', 'Clôturé', d, d, 'Non conforme', s.nc.c, [doc('Rapport de visite', d)]); }
    if (s.notable) { const d = plus(-s.notable.d); ctrl('Contrôle après intervention notable', 'Clôturé', d, d, 'Conforme', s.notable.c, [doc('Rapport intervention', d)]); }
    (s.plan || []).forEach(p => ctrl(p.type, 'Planifié', plus(p.d), '', '', "Contrôle planifié avec l'organisme habilité.", []));
  });
  for (const u of DEMO_USERS) {
    const salt = newSalt(), permissions = {}; PERMS.forEach(p => { permissions[p.key] = u.perms.includes(p.key); });
    ops.push({ ref: db.collection('users').doc(u.username), data: { username: u.username, displayName: u.displayName, role: 'user', active: true, permissions, poles: u.poles, salt, hash: await hashPw(DEMO_PW, salt), createdAt: FV.serverTimestamp() } });
  }
  ops.push({ ref: db.collection('audit').doc(), data: auditEntry({ action: 'Création', entity: 'Application', entityId: 'demo', label: 'Chargement des données de démonstration',
    changes: [{ field: 'ESP', old: '', new: String(specs.length) }, { field: 'Contrôles', old: '', new: String(nCtrl) }, { field: 'Comptes de test', old: '', new: String(DEMO_USERS.length) }] }) });
  for (let k = 0; k < ops.length; k += 400) {
    const b = db.batch(); ops.slice(k, k + 400).forEach(o => b.set(o.ref, o.data)); await b.commit();
  }
  openModal(`<div class="flex items-center justify-between p-4 border-b"><h2 class="text-lg font-semibold">Données de démonstration chargées</h2><button class="btn btn-ghost" data-act="close">Fermer</button></div>
  <div class="p-4 text-sm space-y-3">
    <p>${specs.length} équipements, ${nCtrl} contrôles et ${DEMO_USERS.length} comptes de test ont été créés. Les liens de pièces jointes sont fictifs.</p>
    <div class="overflow-x-auto border rounded-md"><table class="w-full"><thead><tr><th>Identifiant</th><th>Profil</th><th>Pôles visibles</th></tr></thead><tbody>
    ${DEMO_USERS.map(u => `<tr><td class="font-medium">${esc(u.username)}</td><td>${esc(u.displayName)}<div class="text-xs text-slate-500">${esc(u.perms.map(k => PERMS.find(p => p.key === k).label).join(', '))}</div></td><td>${u.poles.length ? esc(u.poles.join(', ')) : 'Tous'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="text-slate-600">Mot de passe des trois comptes : <b>${DEMO_PW}</b>. Connectez-vous avec l'un d'eux dans une fenêtre de navigation privée pour voir l'effet des droits et des pôles. Le bouton « Réinitialiser toutes les données » supprime le tout.</p></div>`);
}

async function wipe(col, keep) {
  const docs = (await db.collection(col).get()).docs.filter(d => !(keep && keep(d)));
  for (let k = 0; k < docs.length; k += 400) { const b = db.batch(); docs.slice(k, k + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  return docs.length;
}
async function resetAll() {
  let n = 0;
  n += await wipe('controls'); n += await wipe('esp'); n += await wipe('audit');
  n += await wipe('users', d => d.data().role === 'admin');          // le compte administrateur est conservé
  await db.collection('audit').add(auditEntry({ action: 'Suppression', entity: 'Application', entityId: 'reset', label: 'Réinitialisation complète des données',
    changes: [{ field: 'Documents supprimés', old: String(n), new: '' }] }));
  return n;
}
function openReset() {
  openModal(`<div class="flex items-center justify-between p-4 border-b"><h2 class="text-lg font-semibold">Réinitialiser toutes les données</h2><button class="btn btn-ghost" data-act="close">Fermer</button></div>
  <form data-form="reset" class="p-4 space-y-3 max-w-md">
    <div class="rounded-md bg-red-50 text-red-800 text-sm p-3" role="alert">Supprime définitivement tous les ESP, tous les contrôles, le journal d'audit et tous les comptes utilisateurs, sauf le compte administrateur. Cette action est irréversible.</div>
    <label class="block text-sm font-medium">Mot de passe administrateur<input class="fld" type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-danger" type="submit">Effacer toutes les données</button></form>`);
}

/* =====================================================================
   15. MODALE
   ===================================================================== */
function openModal(html) { $('#modal-body').innerHTML = html; $('#modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal-body').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' || e.target === $('#modal > div')) closeModal(); });

/* =====================================================================
   16. ÉVÉNEMENTS (délégation)
   ===================================================================== */
document.addEventListener('click', async ev => {
  if (ev.target.closest('a[href]')) return;   // lien externe (ex. CARL Source) : comportement normal, sans ouvrir la fiche de la ligne
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  try {
    switch (el.dataset.act) {
      case 'close': closeModal(); break;
      case 'ctrl-sort': {   // tri : 1er clic croissant, 2e clic décroissant, 3e clic retour à l'ordre par défaut (date)
        const k = el.dataset.key, s = state.sCtrl;
        if (s.key !== k) { s.key = k; s.dir = 'asc'; } else if (s.dir === 'asc') s.dir = 'desc'; else { s.key = ''; s.dir = 'asc'; }
        $('#ctrl-table').innerHTML = ctrlTable();
        $(`#ctrl-table [data-key="${k}"]`)?.focus(); break; }
      case 'logout': logout(); break;
      case 'pwd': openPwd(); break;
      case 'export-csv': exportCsv(); break;
      case 'plan-filter':   // depuis le tableau de bord : liste filtrée sur les échéances sans planification (même pôle)
        state.fEsp = { q: '', status: '', atex: '', due: '', pole: state.fDash.pole, plan: PLAN_FILTER }; location.hash = '#esp'; break;
      case 'plan-new': openCtrl(null, el.dataset.esp, { type: el.dataset.type, due: el.dataset.due }); break;   // « À planifier » → saisie pré-remplie
      case 'dash-reset': Object.assign(state.fDash, { due: '', plan: '', next: '' }); renderView(); break;
      case 'list-del': {
        if (state.user.role !== 'admin') return;
        const key = el.dataset.key, v = el.dataset.val, d = LIST_DEFS[key];
        if ((d.locked || []).includes(v)) return toast('Valeur système : suppression impossible.', 'err');
        const n = usageCount(key, v);
        if (n) return toast(`« ${v} » est utilisé par ${n} élément(s) : réaffectez-les avant de supprimer cette valeur.`, 'err');
        if (!confirm(`Supprimer « ${v} » de la liste « ${d.label} » ? Cette action est tracée dans le journal d'audit.`)) return;
        await saveList(key, listOf(key).filter(x => x !== v), { field: d.label, old: v, new: '' });
        toast('Valeur supprimée'); break; }
      case 'esp-new': openEsp(null); break;
      case 'esp-open': openEsp(id); break;
      case 'esp-delete': {
        const e = espById(id); const cs = state.controls.filter(c => c.espId === id);
        if (!confirm(`Supprimer l'ESP ${e.tag} et ses ${cs.length} contrôle(s) ? Cette action est tracée dans le journal d'audit.`)) return;
        await deleteWithAudit({ col: 'esp', id, entity: 'ESP', label: e.tag, espId: id,
          changes: [{ field: 'Contrôles supprimés', old: cs.map(c => `${c.type} ${c.doneDate || c.plannedDate || ''}`).join(' ; ').slice(0, 200), new: '' }],
          alsoDelete: cs.map(c => ({ col: 'controls', id: c.id })) });
        closeModal(); toast('ESP supprimé'); break; }
      case 'ctrl-new': openCtrl(null, el.dataset.esp); break;
      case 'ctrl-open': openCtrl(id); break;
      case 'ctrl-delete': {
        const c = state.controls.find(x => x.id === id);
        if (!confirm('Supprimer ce contrôle ? Cette action est tracée dans le journal d\'audit.')) return;
        await deleteWithAudit({ col: 'controls', id, entity: 'Contrôle', label: `${c.type} – ${espById(c.espId)?.tag || ''}`, espId: c.espId,
          changes: [{ field: 'Contrôle supprimé', old: `${c.status} ${c.doneDate || c.plannedDate || ''} ${c.result || ''}`, new: '' }] });
        closeModal(); toast('Contrôle supprimé'); break; }
      case 'att-add': {
        const name = $('#att-name').value.trim(), url = $('#att-url').value.trim();
        if (!name || !isHttp(url)) return toast('Renseignez un nom et une URL commençant par http(s)://', 'err');
        ctrlAtt.push({ name, url, kind: 'link' }); $('#att-list').innerHTML = attList(false); $('#att-name').value = $('#att-url').value = ''; break; }
      case 'att-del': ctrlAtt.splice(+el.dataset.i, 1); $('#att-list').innerHTML = attList(false); break;
      case 'demo-load': await loadDemo(); break;
      case 'reset-open': if (state.user.role === 'admin') openReset(); break;
      case 'user-new': openUser(null); break;
      case 'user-open': openUser(id); break;
      case 'user-delete': {
        if (!confirm(`Supprimer l'utilisateur ${id} ?`)) return;
        await deleteWithAudit({ col: 'users', id, entity: 'Utilisateur', label: id });
        closeModal(); toast('Utilisateur supprimé'); break; }
    }
  } catch (e) { console.error(e); toast('Erreur : ' + e.message, 'err'); }
});

// Filtres : mise à jour partielle pour conserver le focus dans les champs
document.addEventListener('input', ev => {
  const p = ev.target.dataset?.filter; if (!p) return;
  const [a, b] = p.split('.'); if (b) state[a][b] = ev.target.value; else state[a] = ev.target.value;
  if (p === 'fDash.pole') return renderView();          // le pôle recalcule aussi les compteurs et les graphiques
  const t = { fEsp: ['#esp-table', espTable], fCtrl: ['#ctrl-table', ctrlTable], fAudit: ['#audit-table', auditBody], fDash: ['#dash-table', dashTable] }[a];
  if (t) $(t[0]).innerHTML = t[1](); else renderView();
});

document.addEventListener('submit', async ev => {
  const form = ev.target, kind = form.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = new FormData(form), g = k => (fd.get(k) || '').toString().trim();
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (kind === 'login') {
      try { startSession(await login(g('username'), fd.get('password'))); }
      catch (e) { renderLogin(e.message); }
      return;
    }
    if (kind === 'esp') {
      const id = form.dataset.id || db.collection('esp').doc().id, before = form.dataset.id ? espById(id) : null;
      const tag = g('tag');
      if (state.esp.some(e => e.id !== id && (e.tag || '').toLowerCase() === tag.toLowerCase())) throw new Error(`Le tag « ${tag} » existe déjà.`);
      const rp = userPoles();
      if (rp.length && !rp.includes(g('pole'))) throw new Error("Ce pôle ne fait pas partie de vos pôles autorisés.");
      const data = { tag, name: g('name'), pole: g('pole'), serial: g('serial'), manufacturer: g('manufacturer'), year: num(g('year')), category: g('category'), type: g('type'),
        fluid: g('fluid'), fluidGroup: g('fluidGroup'), ps: num(g('ps')), volume: num(g('volume')), dn: num(g('dn')), atex: g('atex'), status: g('status'),
        building: g('building'), workshop: g('workshop'), location: g('location'), commissioningDate: g('commissioningDate'),
        ipMonths: num(g('ipMonths')), rpMonths: num(g('rpMonths')), notes: g('notes') };
      const changed = await saveWithAudit({ col: 'esp', id, data, before, entity: 'ESP', label: tag, espId: id });
      closeModal(); toast(changed ? 'ESP enregistré' : 'Aucune modification', changed ? 'ok' : 'info');
    }
    if (kind === 'ctrl') {
      const id = form.dataset.id || db.collection('controls').doc().id, before = form.dataset.id ? { gapRequired: 'Non', gapNumber: '', gapLabel: '', ...state.controls.find(c => c.id === id) } : null;   // anciens contrôles : écart = « Non »
      const st = g('status');
      if (st !== 'Planifié' && !g('doneDate')) throw new Error('La date de réalisation est obligatoire pour un contrôle réalisé ou clôturé.');
      if (st === 'Clôturé' && !g('result')) throw new Error('Le résultat est obligatoire pour clôturer un contrôle.');
      if (st === 'Clôturé' && !can('validate_control')) throw new Error("Vous n'avez pas le droit de clôturer un contrôle.");
      if (g('gapRequired') === 'Oui' && g('gapNumber') && !isCarlNo(g('gapNumber'))) throw new Error("Le n° d'intervention CARL Source doit comporter exactement 6 chiffres.");
      const att = [...ctrlAtt];
      const files = [...(form.elements.files?.files || [])];
      for (const f of files) {
        if (f.size > 10 * 1024 * 1024) throw new Error(`${f.name} dépasse 10 Mo.`);
        const ref = storage.ref(`controls/${id}/${Date.now()}_${f.name.replace(/[^\w.-]/g, '_')}`);
        await ref.put(f); att.push({ name: f.name, url: await ref.getDownloadURL(), kind: 'file' });
      }
      const closing = st === 'Clôturé' && before?.status !== 'Clôturé';
      const data = { espId: g('espId'), type: g('type'), status: st, plannedDate: g('plannedDate'), doneDate: g('doneDate'), inspector: g('inspector'),
        result: g('result'), comment: g('comment'), attachments: att,
        gapRequired: g('gapRequired') === 'Oui' ? 'Oui' : 'Non', gapNumber: g('gapRequired') === 'Oui' ? g('gapNumber') : '', gapLabel: g('gapRequired') === 'Oui' ? g('gapLabel') : '',
        validatedBy: closing ? state.user.username : (st === 'Clôturé' ? before?.validatedBy || '' : ''),
        validatedAt: closing ? todayISO() : (st === 'Clôturé' ? before?.validatedAt || '' : '') };
      const e = espById(data.espId);
      const changed = await saveWithAudit({ col: 'controls', id, data, before, entity: 'Contrôle', label: `${data.type} – ${e?.tag || ''}`, espId: data.espId });
      closeModal(); toast(changed ? 'Contrôle enregistré' : 'Aucune modification', changed ? 'ok' : 'info');
    }
    if (kind === 'listadd') {
      if (state.user.role !== 'admin') throw new Error("Réservé à l'administrateur.");
      const key = form.dataset.key, d = LIST_DEFS[key], v = g('value').replace(/\s+/g, ' ');
      if (!d) throw new Error('Liste inconnue.');
      if (!v) throw new Error('Saisissez une valeur.');
      const cur = listOf(key);
      if (cur.some(x => x.toLowerCase() === v.toLowerCase())) throw new Error(`« ${v} » existe déjà dans cette liste.`);
      await saveList(key, [...cur, v], { field: d.label, old: '', new: v });
      toast('Valeur ajoutée');
    }
    if (kind === 'user') {
      const editing = !!form.dataset.id; const username = (editing ? form.dataset.id : g('username')).toLowerCase();
      const before = editing ? state.users.find(u => u.id === username) : null;
      if (!editing && state.users.some(u => u.id === username)) throw new Error('Cet identifiant existe déjà.');
      const isAdmin = before?.role === 'admin';
      const permissions = {}; PERMS.forEach(p => { permissions[p.key] = isAdmin ? true : !!fd.get('perm_' + p.key); });
      const data = { username, displayName: g('displayName'), role: before?.role || 'user', active: isAdmin ? true : !!fd.get('active'), permissions: isAdmin ? (before.permissions || {}) : permissions, poles: isAdmin ? [] : fd.getAll('poles') };
      const pw = fd.get('password');
      if (pw) { data.salt = newSalt(); data.hash = await hashPw(pw, data.salt); }
      const auditData = { displayName: data.displayName, active: data.active, permissions: data.permissions, poles: data.poles, ...(pw ? { password: '(modifié)' } : {}) };
      const changes = diff(before, auditData);
      if (before && !changes.length) { closeModal(); return toast('Aucune modification', 'info'); }
      const batch = db.batch();
      batch.set(db.collection('users').doc(username), { ...data, ...(before ? {} : { createdAt: FV.serverTimestamp() }) }, { merge: true });
      batch.set(db.collection('audit').doc(), auditEntry({ action: before ? 'Modification' : 'Création', entity: 'Utilisateur', entityId: username, label: username, changes }));
      await batch.commit(); closeModal(); toast('Utilisateur enregistré');
    }
    if (kind === 'reset') {
      if (state.user.role !== 'admin') throw new Error("Réservé à l'administrateur.");
      const u = (await db.collection('users').doc(state.user.username).get()).data();
      if (await hashPw(fd.get('password'), u.salt) !== u.hash) throw new Error('Mot de passe administrateur incorrect.');
      if (!confirm('Dernière confirmation : effacer toutes les données de l\'application ?')) return;
      const n = await resetAll();
      closeModal(); toast(`Données réinitialisées (${n} documents supprimés).`);
    }
    if (kind === 'pwd') {
      const u = (await db.collection('users').doc(state.user.username).get()).data();
      if (await hashPw(fd.get('old'), u.salt) !== u.hash) throw new Error('Mot de passe actuel incorrect.');
      const salt = newSalt();
      const batch = db.batch();
      batch.update(db.collection('users').doc(u.username), { salt, hash: await hashPw(fd.get('new'), salt) });
      batch.set(db.collection('audit').doc(), auditEntry({ action: 'Modification', entity: 'Utilisateur', entityId: u.username, label: u.username, changes: [{ field: 'Mot de passe', old: '', new: '(modifié par l\'utilisateur)' }] }));
      await batch.commit(); closeModal(); toast('Mot de passe modifié');
    }
  } catch (e) { console.error(e); toast(e.message, 'err'); }
  finally { if (btn) btn.disabled = false; }
});

/* =====================================================================
   17. DÉMARRAGE
   ===================================================================== */
(async function boot() {
  if (FIREBASE_CONFIG.apiKey.startsWith('VOTRE')) return configMissing();
  initFirebase();
  if (USE_ANON_AUTH) { try { await auth.signInAnonymously(); } catch (e) { console.warn('Auth anonyme indisponible :', e.message); toast("Activez l'authentification anonyme dans Firebase (voir README).", 'err'); } }
  const saved = sessionStorage.getItem('esp_user');
  if (saved) {
    try { const s = await db.collection('users').doc(saved).get(); if (s.exists && s.data().active !== false) return startSession(s.data()); } catch (e) { console.error(e); }
  }
  renderLogin();
})();
</script>
